services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: easycmdb
            POSTGRES_PASSWORD: easycmdb
            POSTGRES_DB: easycmdb
        ports:
            - '127.0.0.1:5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U easycmdb -d easycmdb']
            interval: 2s
            timeout: 5s
            retries: 30
